name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      drift:
        description: Check source and dependency drift
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@58a81e10a3bd6bcb7c4f5db37fe840e0237afb67
    with:
      tooling_ref: 58a81e10a3bd6bcb7c4f5db37fe840e0237afb67
  drift:
    if: github.event_name == 'schedule' || inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@58a81e10a3bd6bcb7c4f5db37fe840e0237afb67
    with:
      tooling_ref: 58a81e10a3bd6bcb7c4f5db37fe840e0237afb67
      drift: true
