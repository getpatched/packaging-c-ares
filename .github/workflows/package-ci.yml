name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      drift:
        description: Check source and dependency drift
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@259f7cac3f785edafec6ac48c6d490ab5dd87e8d
    with:
      tooling_ref: 259f7cac3f785edafec6ac48c6d490ab5dd87e8d
  drift:
    name: Drift (${{ matrix.branch }})
    if: github.event_name == 'schedule' || inputs.drift
    strategy:
      fail-fast: false
      matrix:
        branch: ["getpatched/focal", "getpatched/debian-trixie"]
    uses: getpatched/actions/.github/workflows/package-ci.yml@ef3f23009b189a210ecbf2c7f2d6d218abb95adc
    with:
      tooling_ref: ef3f23009b189a210ecbf2c7f2d6d218abb95adc
      drift: true
      recipe_ref: refs/heads/${{ matrix.branch }}
